services:
  techgear-api:
    build:
      context: ./TechGear.Api
      dockerfile: Dockerfile
    container_name: techgear-backend
    
    # === AGREGA ESTO AQUÍ ===
    env_file:
      - .env
    # ========================

    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Al usar env_file, Docker carga las variables automáticamente,
      # pero mantenemos este mapeo para traducir los nombres al formato de .NET (__)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - JwtSettings__TokenKey=${JWT_SECRET}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD}
      - Cloudinary__ApiKey=${CLOUDINARY_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_SECRET}